name: Save covers
# Runs by itself whenever covers.json changes: downloads any new images into covers/ on the Pages branch.
on:
  push:
    branches: [main]
    paths: [covers.json, .github/workflows/covers.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-addons   # same group as "Build addons" so the two never push at once
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    env:
      PAGES_BRANCH: "claude/maid-hotel-game-kga08a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: site
      - name: Download new covers
        run: |
          cd site && mkdir -p covers
          node -e '
            const { covers } = require("../covers.json");
            for (const c of covers) console.log(c.file + "\t" + c.url);
          ' | while IFS="$(printf "\t")" read -r file url; do
            [ -s "covers/$file" ] && continue
            curl -fsSL -A "Mozilla/5.0" "$url" -o "covers/$file" && echo "saved covers/$file" || echo "!! could not save $file"
          done
      - name: Publish
        run: |
          cd site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A covers
          if ! git diff --cached --quiet; then
            git commit -m "Save cover images"
            git push origin HEAD:${{ env.PAGES_BRANCH }}
          fi
