name: Rotten Tomatoes JSON
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RT_MAX: "200"
      PAGES_BRANCH: "claude/maid-hotel-game-kga08a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hulu TV
        run: cd site && node ../scripts/rt.mjs
        continue-on-error: true
        env:
          RT_URL: "https://www.rottentomatoes.com/browse/tv_series_browse/affiliates:hulu~sort:newest"
          OUT: "rt"
          NAME: "Latest Hulu"
          ADDON_NAME: "Latest Hulu"
      - name: Hulu Movies
        run: cd site && node ../scripts/rt.mjs
        continue-on-error: true
        env:
          RT_URL: "https://www.rottentomatoes.com/browse/movies_at_home/affiliates:hulu~sort:newest"
          OUT: "rt"
          NAME: "Latest Hulu"
          ADDON_NAME: "Latest Hulu"
      - run: |
          cd site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rt
          if ! git diff --cached --quiet; then
            git commit -m "Update Rotten Tomatoes JSON"
            git push origin HEAD:${{ env.PAGES_BRANCH }}
          fi
