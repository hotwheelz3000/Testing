<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Beaumont Housekeeping GC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c1c1e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif}
#phone{width:390px;max-width:100vw;height:844px;max-height:100svh;background:#fff;border-radius:48px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,255,255,.12)}
/* Status bar */
#notch-bar{background:#000;height:54px;display:flex;align-items:flex-end;padding:0 20px 8px;justify-content:space-between;flex-shrink:0;position:relative}
#notch-bar::before{content:'';position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:1}
.nb-time{color:#fff;font-size:15px;font-weight:600;position:relative;z-index:2}
.nb-icons{display:flex;align-items:center;gap:6px;position:relative;z-index:2}
.nb-icons svg{fill:#fff}
/* iMessage header */
#imessage-header{background:#fff;border-bottom:.5px solid rgba(0,0,0,.15);padding:8px 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-back{color:#007aff;font-size:18px;cursor:pointer}
.hdr-av{width:42px;height:42px;border-radius:21px;background:linear-gradient(135deg,#34c759,#007aff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.5px;flex-shrink:0;position:relative}
.hdr-av::after{content:'';position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:6px;background:#34c759;border:2px solid #fff}
.hdr-info{flex:1;min-width:0;text-align:center}
.hdr-name{font-size:15px;font-weight:600;color:#000}
.hdr-sub{font-size:11px;color:#8e8e93;margin-top:1px}
.hdr-actions{display:flex;gap:18px;color:#007aff;font-size:20px;cursor:pointer}
/* Stats area */
#stats-area{background:#1c1c1e;flex-shrink:0}
#level-bar{padding:6px 12px 4px;display:flex;align-items:center;gap:7px}
#level-name{font-size:12px;font-weight:700;color:#fff;flex:1}
#diff-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px}
.prog-dots{display:flex;gap:4px}
.pd{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .3s}
.pd.cur{background:#34c759}.pd.done{background:rgba(255,255,255,.45)}
#stat-strip{display:flex;padding:3px 8px 5px;gap:4px}
.sp{flex:1;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 5px;text-align:center}
.sp-l{font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.3px}
.sp-v{font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.sg{color:#34c759!important}.sy{color:#ff9500!important}.sr{color:#ff3b30!important}
#cafe-strip{padding:2px 12px 4px;display:flex;align-items:center;gap:5px;min-height:20px}
.cs-l{font-size:11px;color:rgba(255,255,255,.4);flex:1}
.cs-v{font-size:11px;font-weight:600;color:rgba(255,255,255,.7)}
.shift-chip{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}
#floor-strip{display:flex;padding:3px 8px 6px;gap:4px}
.fc{flex:1;background:rgba(255,255,255,.08);border-radius:7px;padding:4px 5px;text-align:center}
.fc-l{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.3px}
.fc-v{font-size:12px;font-weight:700;color:#fff;margin-top:1px}
/* Chat */
#chat{flex:1;overflow-y:auto;background:#fff;padding:10px 10px 4px;display:flex;flex-direction:column;gap:1px}
#chat::-webkit-scrollbar{width:0}
.date-stamp{text-align:center;font-size:12px;color:#8e8e93;font-weight:500;margin:10px 0 4px}
.msg-row{display:flex;align-items:flex-end;gap:6px;margin:2px 0}
.msg-row.r{flex-direction:row-reverse}
.av-sm{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;margin-bottom:12px}
.sender-n{font-size:11px;color:#8e8e93;margin-bottom:2px;margin-left:32px}
.bubble{padding:8px 12px;font-size:15px;line-height:1.4;max-width:76%;word-break:break-word;border-radius:18px 18px 18px 4px;background:#e9e9eb;color:#000}
.msg-row.r .bubble{background:#007aff;color:#fff;border-radius:18px 18px 4px 18px;margin-left:auto}
.bubble.sms{background:#d4efda;color:#000}
.bubble.chaos-b{background:#fff0f0;border:1px solid #ff3b30;color:#1c1c1e;border-radius:14px}
.bubble.sys{background:none;color:#8e8e93;font-size:12px;text-align:center;width:100%;padding:2px 0}
.delivered{text-align:right;font-size:11px;color:#8e8e93;margin-right:4px;margin-top:2px}
/* Typing */
.typing-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.typing-b{background:#e9e9eb;border-radius:18px;padding:9px 13px;display:flex;gap:4px;align-items:center}
.td{width:7px;height:7px;border-radius:4px;background:#8e8e93;animation:tb 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* Choice area */
#choice-area{background:#f2f2f7;border-top:.5px solid rgba(0,0,0,.1);padding:9px 11px 14px;flex-shrink:0;max-height:46%;overflow-y:auto}
#choice-label{font-size:13px;font-weight:600;color:#3c3c43;margin-bottom:7px;line-height:1.3}
#choices-wrap{display:flex;flex-direction:column;gap:6px}
.cb{background:#fff;border:none;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.1);width:100%;display:block;transition:opacity .15s}
.cb:active{opacity:.7}
.cb-t{font-size:14px;font-weight:500;color:#1c1c1e!important;-webkit-text-fill-color:#1c1c1e!important;line-height:1.35;display:block}
.cb-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;color:#fff!important;-webkit-text-fill-color:#fff!important}
.tg{background:#34c759}.tr{background:#ff3b30}.tb{background:#007aff}.to{background:#ff9500}.tgr{background:#8e8e93}
/* Promo card */
.promo-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);margin:6px 0}
.promo-hdr{background:linear-gradient(135deg,#1c1c1e,#3a3a3c);padding:14px 16px;color:#fff}
.promo-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);margin-bottom:5px}
.promo-title{font-size:20px;font-weight:800;line-height:1.2}
.promo-body{padding:12px 16px;font-size:14px;color:#3c3c43;line-height:1.5}
.promo-cta{padding:0 16px 14px}
.promo-btn{background:#007aff;color:#fff!important;-webkit-text-fill-color:#fff!important;border:none;border-radius:10px;padding:11px;width:100%;font-size:15px;font-weight:600;cursor:pointer}
/* Diff screen */
.diff-title{font-size:15px;font-weight:700;color:#1c1c1e;text-align:center;margin-bottom:4px}
.diff-sub{font-size:13px;color:#8e8e93;text-align:center;margin-bottom:9px}
.diff-btn{background:#fff;border:none;border-radius:12px;padding:11px 13px;margin-bottom:7px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;text-align:left;width:100%;display:block}
.diff-btn-name{font-size:15px;font-weight:700;color:#1c1c1e!important;-webkit-text-fill-color:#1c1c1e!important;margin-bottom:2px}
.diff-btn-desc{font-size:12px;color:#8e8e93!important;-webkit-text-fill-color:#8e8e93!important;line-height:1.35}
/* End */
.end-card{background:linear-gradient(155deg,#1c1c1e,#3a3a3c);border-radius:14px;padding:20px;color:#fff;margin:6px 0}
.end-title{font-size:20px;font-weight:800;margin-bottom:6px}
.end-score{font-size:44px;font-weight:900;color:#ffd60a;margin:6px 0}
.end-breakdown{font-size:13px;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:14px}
.end-btn{background:#007aff;color:#fff!important;-webkit-text-fill-color:#fff!important;border:none;border-radius:10px;padding:12px;width:100%;font-size:15px;font-weight:700;cursor:pointer}
/* Save banner */
.save-banner{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);margin-bottom:8px}
.save-banner-t{font-size:14px;font-weight:600;color:#1c1c1e!important;-webkit-text-fill-color:#1c1c1e!important;margin-bottom:8px}
.save-banner-btns{display:flex;gap:8px}
.save-banner-btns button{flex:1;border:none;border-radius:9px;padding:9px;font-size:14px;font-weight:600;cursor:pointer}
.sbb-c{background:#007aff;color:#fff!important;-webkit-text-fill-color:#fff!important}
.sbb-n{background:#e9e9eb;color:#1c1c1e!important;-webkit-text-fill-color:#1c1c1e!important}
</style>
</head>
<body>
<div id="phone">
  <div id="notch-bar">
    <span class="nb-time" id="nb-clock">9:41</span>
    <div class="nb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx=".5"/><rect x="4.5" y="5.5" width="3" height="6.5" rx=".5"/><rect x="9" y="3" width="3" height="9" rx=".5"/><rect x="13.5" y="0" width="3" height="12" rx=".5" opacity=".3"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><circle cx="8" cy="10.5" r="1.5"/><path d="M4.8 7.5a4.5 4.5 0 016.4 0M2 4.8a8 8 0 0112 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".4"/><rect x="2" y="3" width="16" height="6" rx="1.2" fill="#fff"/></svg>
    </div>
  </div>
  <div id="imessage-header">
    <span class="hdr-back">‹</span>
    <div class="hdr-av">BHG</div>
    <div class="hdr-info">
      <div class="hdr-name">Beaumont Housekeeping GC</div>
      <div class="hdr-sub">12 members · iMessage</div>
    </div>
    <div class="hdr-actions"><span>📞</span><span>📹</span></div>
  </div>
  <div id="stats-area">
    <div id="level-bar">
      <span id="level-name">Beaumont GC</span>
      <span id="diff-badge"></span>
      <div class="prog-dots"><div class="pd" id="pd1"></div><div class="pd" id="pd2"></div><div class="pd" id="pd3"></div><div class="pd" id="pd4"></div></div>
    </div>
    <div id="stat-strip">
      <div class="sp"><div class="sp-l">Budget</div><div class="sp-v" id="sv-m">—</div></div>
      <div class="sp"><div class="sp-l">Rep</div><div class="sp-v" id="sv-r">—</div></div>
      <div class="sp"><div class="sp-l">Chaos</div><div class="sp-v" id="sv-c">—</div></div>
      <div class="sp"><div class="sp-l">Staff</div><div class="sp-v" id="sv-s">12</div></div>
    </div>
    <div id="cafe-strip"><span class="cs-l">Cafe</span><span id="cafe-val" class="cs-v">Closed</span></div>
    <div id="floor-strip">
      <div class="fc"><div class="fc-l">Lobby</div><div class="fc-v" id="fv-l">—</div></div>
      <div class="fc"><div class="fc-l">Floor 1</div><div class="fc-v" id="fv-1">—</div></div>
      <div class="fc"><div class="fc-l">Floor 2</div><div class="fc-v" id="fv-2">—</div></div>
      <div class="fc"><div class="fc-l">Floor 3</div><div class="fc-v" id="fv-3">—</div></div>
    </div>
  </div>
  <div id="chat"></div>
  <div id="choice-area">
    <div id="choice-label"></div>
    <div id="choices-wrap"></div>
  </div>
</div>
<script>
// ── Characters ──────────────────────────────────────────────────────────────
const CH={
  gloria:  {name:'Gloria',       i:'GL',c:'#5856d6'},
  darnell: {name:'Darnell',      i:'DA',c:'#ff9500'},
  yuki:    {name:'Yuki',         i:'YU',c:'#ff2d55'},
  rosa:    {name:'Rosa',         i:'RO',c:'#34c759'},
  pete:    {name:'Mr. Pete',     i:'MP',c:'#007aff'},
  jenkins: {name:'Mr. Jenkins',  i:'MJ',c:'#636366'},
  abrams:  {name:'Mrs. Abrams',  i:'MA',c:'#af52de'},
  kowalski:{name:'Mr. Kowalski', i:'MK',c:'#5ac8fa'},
  park:    {name:'Mrs. Park',    i:'PK',c:'#ff6b35'},
  benny:   {name:'Chef Benny',   i:'CB',c:'#4cd964'},
  dario:   {name:'Chef Dario',   i:'CD',c:'#2c2c2e'},
  city:    {name:'City Office',  i:'CO',c:'#6d6d70'},
  housing: {name:'Housing Board',i:'HB',c:'#6d6d70'},
  news:    {name:'NewsChannel7', i:'NC',c:'#ff3b30'},
  deliver: {name:'QuickDeliver', i:'QD',c:'#007aff'},
  lawyer:  {name:'Housing Lawyer',i:'HL',c:'#34c759'},
};
const SMS_CHARS=new Set(['city','housing','news','deliver','lawyer']);

// ── Difficulty ───────────────────────────────────────────────────────────────
const DIFF={
  easy:  {label:'Easy',  money:35000,chaosStart:5, cm:.5, color:'#34c759',skipChance:.5,cpp:1},
  medium:{label:'Medium',money:30000,chaosStart:10,cm:1,  color:'#ff9500',skipChance:0, cpp:1},
  hard:  {label:'Hard',  money:22000,chaosStart:18,cm:1.8,color:'#ff3b30',skipChance:0, cpp:2},
};

// ── Cafe Shifts ───────────────────────────────────────────────────────────────
const SHIFTS=[
  {label:'Morning',   time:'8am–2pm', chef:'Chef Benny'},
  {label:'Afternoon', time:'2pm–8pm', chef:'Chef Margot'},
  {label:'Late Night',time:'8pm–2am', chef:'Chef Dario'},
];

// ── Chaos Pools ───────────────────────────────────────────────────────────────
const CHAOS_L1=[
  {title:'Raccoon in the Loading Dock',msg:"There is a raccoon in the loading dock. It's not leaving. It has opinions.",c:'darnell',
   choices:[{t:'Shoo it with a broom',money:0,rep:3,chaos:-1,result:"Gone. Left a look over its shoulder that felt personal."},
            {t:'Call animal control',money:-150,rep:5,chaos:-2,result:"Removed professionally. The raccoon was not impressed."},
            {t:'Leave snacks to lure it out',money:-20,rep:2,chaos:2,result:"It left. It brought a friend. The friend brought a friend."}]},
  {title:'A Cat Has Adopted the Lobby',msg:"There is an orange cat on the front desk. It has been here since Tuesday. Mr. Pete has opinions about this.",c:'pete',
   choices:[{t:"Keep it — Mr. Pete adopts it. Name it Beaumont.",money:0,rep:10,chaos:-2,result:"Beaumont now lives in Room 108 unofficially. The residents love him."},
            {t:'Find it a home elsewhere',money:0,rep:5,chaos:-2,result:"Found a home. Mr. Pete did not speak to anyone for the rest of the day."},
            {t:'Ignore it and see what happens',money:0,rep:1,chaos:2,result:"It's still there. It's getting comfortable. It has learned the elevator schedule."}]},
  {title:'Piano Found in Basement Storage',msg:"There's an upright piano in sub-basement storage. Out of tune. No one knows how long it's been down there.",c:'yuki',
   choices:[{t:'Move it to the lobby — a community piano',money:-80,rep:10,chaos:1,result:"Lobby piano hours start immediately. Darnell plays a single dramatic chord every morning."},
            {t:'Donate it to a local school',money:0,rep:8,chaos:-1,result:"The school is thrilled. The Bugle covers it."},
            {t:'Leave it. Rosa will catalogue it.',money:0,rep:2,chaos:-1,result:"It's in Tab 12 now. Sub-section: Mysterious Assets."}]},
  {title:'Jenkins Hit Reply-All Again',msg:"I have sent an update regarding globe storage protocols to the relevant parties. — Mr. Jenkins",c:'jenkins',
   choices:[{t:'Reply-all with a polite note to use direct messages',money:0,rep:3,chaos:2,result:"Jenkins replies-all to acknowledge this. Three residents weigh in."},
            {t:'Quietly explain reply-all to Jenkins in person',money:0,rep:5,chaos:-2,result:"He nods. He understands. He sends a follow-up reply-all to confirm."},
            {t:'Do nothing — let it pass',money:0,rep:1,chaos:1,result:"Mrs. Abrams timestamps her response. Kowalski begins drafting an editorial."}]},
  {title:'The WiFi Router Has Gone Missing',msg:"The router is not in the closet. It is not on the cart. It is not anywhere that I can find, which means it is somewhere I have not looked yet.",c:'yuki',
   choices:[{t:'Yuki does a full room-by-room sweep',money:0,rep:5,chaos:-3,result:"Found in Room 204, under a mattress. No one admitted to moving it."},
            {t:'Buy a replacement router immediately',money:-80,rep:4,chaos:-2,result:"Installed in an hour. The original was later found in the soap dispenser closet."},
            {t:'Post a note in the lobby asking residents',money:0,rep:2,chaos:1,result:"A chain of notes follows. No router. More notes."}]},
  {title:'The Umbrella Stand Is at Capacity',msg:"47 umbrellas. All unclaimed. Blocking part of the entrance. I have photographed them at timestamps.",c:'abrams',
   choices:[{t:'Organize a lost & found and post notices',money:0,rep:5,chaos:-1,result:"Three umbrellas claimed. 44 remain. The stand has been reorganized."},
            {t:'Donate the excess umbrellas',money:0,rep:8,chaos:-2,result:"Donated to a shelter. Mrs. Abrams logs the transfer formally."},
            {t:"Darnell builds an 'umbrella installation'",money:0,rep:6,chaos:2,result:"It's a conversation piece. Kowalski writes 200 words about it."}]},
  {title:'Darnell Accidentally Booked a Yoga Class',msg:"I saw 'lobby available 9am' in the calendar and filled in the form. I may have selected the wrong dropdown. Twelve people are arriving.",c:'darnell',
   choices:[{t:'Cancel and send apologies',money:-20,rep:3,chaos:-1,result:"Cancelled with grace. The instructor was very understanding. Darnell took a picture."},
            {t:'Let the class happen — the lobby needs the energy',money:0,rep:8,chaos:2,result:"It was great. Four residents joined in. Mrs. Park filmed it silently from the corridor."},
            {t:'Make it an official resident yoga event',money:-50,rep:12,chaos:1,result:"Now a weekly fixture. Rosa has added it to the schedule. Darnell takes attendance."}]},
  {title:'The Soap Dispenser in 3B Never Runs Out',msg:"I have been refilling the 3B soap dispenser monthly for 7 months. According to my logs, it has not decreased once. Tab 14, Sub-section: Anomalies.",c:'rosa',
   choices:[{t:'Investigate seriously',money:0,rep:5,chaos:-1,result:"Mr. Pete has been quietly refilling it. He was embarrassed. He was thanked."},
            {t:'Accept the mystery and move on',money:0,rep:3,chaos:0,result:"Added to Tab 14B: Accepted Mysteries. Rosa is at peace."},
            {t:'Replace it with a new one',money:-30,rep:2,chaos:-2,result:"Done. The new one ran out in 3 days. Rosa has thoughts."}]},
  {title:'Mr. Kowalski Publishes The Bugle Vol. 1 No. 1',msg:"I am pleased to distribute Volume 1, Number 1 of THE BEAUMONT BUGLE. Times New Roman. For gravitas.",c:'kowalski',
   choices:[{t:'Celebrate it — this is wonderful',money:0,rep:8,chaos:-1,result:"The Bugle is a hit. Residents read it in the lobby. Beaumont the cat sits on a copy."},
            {t:'Suggest a brief editorial review process',money:0,rep:4,chaos:-2,result:"Kowalski accepts. The process becomes Tab 22 in Rosa's system."},
            {t:'Ignore it and hope for the best',money:0,rep:1,chaos:1,result:"Volume 2 will cover the umbrella situation in some depth."}]},
  {title:"Mrs. Park's Soup Has Reached Floor 2",msg:"For the record, the soup smell first arrived at Floor 2 at 11:23am on Tuesday. I have documentation.",c:'abrams',
   choices:[{t:'Adjust the ventilation routing',money:-100,rep:5,chaos:-3,result:"Smell contained to Floor 1 and the cafe corridor. Mrs. Park is pleased."},
            {t:"Invite Mrs. Park to use the cafe kitchen",money:0,rep:10,chaos:-2,result:"She agrees. The cafe now has a daily soup special. It sells out every time."},
            {t:'Issue a polite general note about cooking smells',money:0,rep:-2,chaos:2,result:"Mrs. Park is offended. The note is now in Mrs. Abrams' documentation."}]},
  {title:'Old Room Service Menu Found',msg:"Found in a drawer in 211. Club sandwich: $8. Orange juice: $4. I would like to honor these prices.",c:'darnell',
   choices:[{t:'Frame it as lobby decor — a piece of history',money:0,rep:7,chaos:-1,result:"Framed and mounted. Residents stop to read it. Kowalski writes a retrospective."},
            {t:"Let Darnell honor the prices for one lunch service",money:-180,rep:15,chaos:1,result:"Darnell serves 30 guests at 2004 prices. He's never been happier."},
            {t:'File it with Rosa — historical document',money:0,rep:3,chaos:-1,result:"Catalogued under Tab 12B: Hotel Ephemera. Date-stamped."}]},
  {title:'The Elevator Plays Mystery Music',msg:"Smooth jazz. Intermittent. No one selected it. The source is not the speaker panel.",c:'yuki',
   choices:[{t:'Investigate fully',money:0,rep:4,chaos:-2,result:"A Bluetooth speaker behind the rear panel. Mr. Pete installed it. He thought it would be nice."},
            {t:'Embrace it — the elevator has taste',money:0,rep:9,chaos:1,result:"Now a feature, not a bug. Residents request specific songs."},
            {t:'Disable all elevator audio immediately',money:-40,rep:2,chaos:-2,result:"Done. The silence is notable. Mr. Pete seems sad."}]},
  {title:'Package Addressed to "The Hotel"',msg:"No room number. No resident name. Just: The Hotel, Beaumont, City. It is large.",c:'gloria',
   choices:[{t:'Open it carefully',money:0,rep:3,chaos:1,result:"It's a ficus. A very large ficus. A note says 'You'll know where it belongs.' We do not."},

  mv.className='sp-v '+(money>15000?'sg':money>5000?'sy':'sr');
  // rep
  const rv=document.getElementById('sv-r');
  rv.textContent=rep;
  rv.className='sp-v '+(rep>60?'sg':rep>30?'sy':'sr');
  // chaos
  const cv=document.getElementById('sv-c');
  cv.textContent=chaos;
  cv.className='sp-v '+(chaos<10?'sg':chaos<20?'sy':'sr');
  // floors
  const fc=v=>v==null?'—':v+'/10';
  document.getElementById('fv-l').textContent=fc(floors.lobby);
  document.getElementById('fv-1').textContent=fc(floors.f1);
  document.getElementById('fv-2').textContent=fc(floors.f2);
  document.getElementById('fv-3').textContent=fc(floors.f3);
  // cafe
  let cafeStr='Closed';
  if(cafe.open){
    cafeStr=fmtM(cafe.income)+'/wk';
    const strip=document.getElementById('cafe-strip');
    strip.innerHTML='<span class="cs-l">Cafe</span><span id="cafe-val" class="cs-v">'+cafeStr+'</span>';
    (cafe.shifts||[]).forEach(i=>{const ch=document.createElement('span');ch.className='shift-chip';ch.textContent=SHIFTS[i].label;strip.appendChild(ch);});
  } else {
    document.getElementById('cafe-strip').innerHTML='<span class="cs-l">Cafe</span><span id="cafe-val" class="cs-v">Closed</span>';
  }
  // delivery
  if(delivery&&delivery.on){
    const strip=document.getElementById('cafe-strip');
    const d2=document.createElement('span');d2.className='shift-chip';d2.textContent='📦 Delivery';strip.appendChild(d2);
  }
  // level bar
  document.getElementById('level-name').textContent=
    level===1?'Week One':level===2?'The Floors':level===3?'Full Operations':level===4?'All Chaos':'—';
  const badge=document.getElementById('diff-badge');
  if(d.label){badge.textContent=d.label;badge.style.background=d.color;badge.style.color='#fff';}
  // progress dots
  for(let i=1;i<=4;i++){
    const el=document.getElementById('pd'+i);
    el.className='pd'+(i<level?' done':i===level?' cur':'');
  }
}

// ── Chat UI ───────────────────────────────────────────────────────────────────
let typingEl=null;
function showTyping(charKey){
  hideTyping();
  const ch=CH[charKey];
  const row=document.createElement('div');row.className='typing-row';
  const av=document.createElement('div');av.className='av-sm';av.style.background=ch.c;av.textContent=ch.i;
  const b=document.createElement('div');b.className='typing-b';
  b.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  row.appendChild(av);row.appendChild(b);
  document.getElementById('chat').appendChild(row);
  typingEl=row;scrollBottom();
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

async function addMsg(charKey,text,extraClass=''){
  showTyping(charKey);
  await delay(700+rand(600));
  hideTyping();
  const ch=CH[charKey];
  const isSms=SMS_CHARS.has(charKey);
  const chat=document.getElementById('chat');
  // sender name
  const sn=document.createElement('div');sn.className='sender-n';sn.textContent=ch.name;chat.appendChild(sn);
  const row=document.createElement('div');row.className='msg-row';
  const av=document.createElement('div');av.className='av-sm';av.style.background=ch.c;av.textContent=ch.i;
  const b=document.createElement('div');
  b.className='bubble'+(isSms?' sms':'')+(extraClass?' '+extraClass:'');
  b.textContent=text;
  row.appendChild(av);row.appendChild(b);
  chat.appendChild(row);scrollBottom();
}

async function addMyMsg(text){
  await delay(400);
  const chat=document.getElementById('chat');
  const row=document.createElement('div');row.className='msg-row r';
  const b=document.createElement('div');b.className='bubble';b.textContent=text;
  row.appendChild(b);chat.appendChild(row);
  const d=document.createElement('div');d.className='delivered';d.textContent='Delivered '+gt();
  chat.appendChild(d);scrollBottom();
}

function addSysMsg(text){
  const chat=document.getElementById('chat');
  const b=document.createElement('div');b.className='bubble sys';b.textContent=text;
  chat.appendChild(b);scrollBottom();
}

function addDateStamp(text){
  const d=document.createElement('div');d.className='date-stamp';d.textContent=text;
  document.getElementById('chat').appendChild(d);scrollBottom();
}

// ── Choice UI ─────────────────────────────────────────────────────────────────
function setChoiceLabel(text){document.getElementById('choice-label').textContent=text;}
function clearChoices(){document.getElementById('choices-wrap').innerHTML='';}

function renderChoices(choices,onPick){
  clearChoices();
  const wrap=document.getElementById('choices-wrap');
  choices.forEach((ch,i)=>{
    const btn=document.createElement('button');btn.className='cb';
    const t=document.createElement('span');t.className='cb-t';t.textContent=ch.t;btn.appendChild(t);
    const tags=document.createElement('div');tags.className='cb-tags';
    if(ch.money){const v=ch.money+(ch.money2||0);tags.appendChild(makeTag(fmtM(v),v>0?'tg':'tr'));}
    if(ch.rep){tags.appendChild(makeTag((ch.rep>0?'+':'')+ch.rep+' rep',ch.rep>0?'tg':'tr'));}
    if(ch.chaos!=null&&ch.chaos!==0){tags.appendChild(makeTag((ch.chaos>0?'+':'')+ch.chaos+' chaos',ch.chaos>0?'tr':'tg'));}
    if(ch.cafeOpen){tags.appendChild(makeTag('☕ Cafe open','tb'));}
    if(ch.delivOn){tags.appendChild(makeTag('📦 Delivery','tb'));}
    if(ch.f1||ch.f2||ch.f3){const fc=(ch.f1||0)+(ch.f2||0)+(ch.f3||0);tags.appendChild(makeTag('+'+fc+' clean','tg'));}
    btn.appendChild(tags);
    btn.addEventListener('click',()=>{
      wrap.querySelectorAll('.cb').forEach(b=>b.disabled=true);
      onPick(ch,i);
    });
    wrap.appendChild(btn);
  });
}

// ── Promo Card ────────────────────────────────────────────────────────────────
function showPromo(){
  const pool=[PROMOS_L1,PROMOS_L2,PROMOS_L3][st.level-1];
  if(!pool){runChaosLevel();return;}
  const p=pick(pool);
  clearChoices();
  const wrap=document.getElementById('choices-wrap');
  const card=document.createElement('div');card.className='promo-card';
  card.innerHTML=`<div class="promo-hdr"><div class="promo-badge">${p.badge}</div><div class="promo-title">${p.title}</div></div><div class="promo-body">${p.body.replace(/\n/g,'<br><br>')}</div><div class="promo-cta"><button class="promo-btn" onclick="startScenarios()">${p.cta}</button></div>`;
  wrap.appendChild(card);
  setChoiceLabel('');
}

// ── Diff Screen ───────────────────────────────────────────────────────────────
function showDiff(){
  // reset DOM fully
  document.getElementById('chat').innerHTML='';
  setChoiceLabel('');
  clearChoices();
  const wrap=document.getElementById('choices-wrap');
  // check for save
  const saved=localStorage.getItem('beaumont_save');
  if(saved){
    try{
      const s=JSON.parse(saved);
      const banner=document.createElement('div');banner.className='save-banner';
      banner.innerHTML=`<div class="save-banner-t">Continue from Day ${s.day||'?'}, Level ${s.level||'?'}?</div><div class="save-banner-btns"><button class="sbb-c" onclick="loadGame()">Continue</button><button class="sbb-n" onclick="newGameMenu()">New Game</button></div>`;
      wrap.appendChild(banner);return;
    }catch(e){}
  }
  newGameMenu();
}

function newGameMenu(){
  clearChoices();
  const wrap=document.getElementById('choices-wrap');
  const title=document.createElement('div');title.className='diff-title';title.textContent='Choose Difficulty';
  const sub=document.createElement('div');sub.className='diff-sub';sub.textContent='Affects starting budget, chaos rate, and event intensity.';
  wrap.appendChild(title);wrap.appendChild(sub);
  Object.entries(DIFF).forEach(([key,d])=>{
    const btn=document.createElement('button');btn.className='diff-btn';
    btn.innerHTML=`<div class="diff-btn-name" style="color:${d.color}!important;-webkit-text-fill-color:${d.color}!important">${d.label}</div><div class="diff-btn-desc">${fmtM(d.money)} start · ${d.cpp===2?'2 chaos events/turn':'1 chaos event/turn'}${d.skipChance?` · ${d.skipChance*100}% skip chance`:''}</div>`;
    btn.addEventListener('click',()=>startGame(key));
    wrap.appendChild(btn);
  });
}

function loadGame(){
  try{st=JSON.parse(localStorage.getItem('beaumont_save'));}catch(e){newGameMenu();return;}
  if(st.dead){localStorage.removeItem('beaumont_save');newGameMenu();return;}
  updateStats();
  addSysMsg('— Resumed —');
  runScenario();
}

// ── Game Init ─────────────────────────────────────────────────────────────────
function startGame(diff){
  st={
    diff,money:DIFF[diff].money,rep:60,chaos:DIFF[diff].chaosStart,
    cafe:{open:false,income:0,shifts:[]},delivery:{on:false,income:0},
    floors:{lobby:5,f1:0,f2:0,f3:0},
    level:1,scenario:0,day:1,
    levels:[pick3(L1_POOL),pick3(L2_POOL),pick3(L3_POOL)],
    chaosQueue:[],lastChaos:null,usedChaos:{},chaosCount:0,l4Count:0,dead:false,
  };
  saveGame();
  updateStats();
  document.getElementById('chat').innerHTML='';
  addDateStamp('Monday, Day 1');
  clearChoices();
  showPromo();
}

function startScenarios(){runScenario();}

function saveGame(){try{localStorage.setItem('beaumont_save',JSON.stringify(st));}catch(e){}}

// ── Game Over Check ───────────────────────────────────────────────────────────
function checkGameOver(){
  if(st.dead) return true;
  if(st.money< -3000){st.dead=true;gameLost('The operating fund ran dry. The building gave everything it had.');return true;}
  if(st.rep<=0){st.dead=true;gameLost('The team\'s reputation collapsed. Every resident deserved better.');return true;}
  if(st.chaos>=40){st.dead=true;gameLost('Chaos overwhelmed operations. Twelve people couldn\'t hold it together.');return true;}
  return false;
}
function gameLost(reason){
  localStorage.removeItem('beaumont_save');
  clearChoices();setChoiceLabel('');
  const wrap=document.getElementById('choices-wrap');
  const card=document.createElement('div');card.className='end-card';
  card.style.cssText='background:linear-gradient(155deg,#2c0000,#1c1c1e)';
  card.innerHTML=`<div class="end-title" style="color:#ff3b30">The Building Closed</div><div class="end-score" style="font-size:32px;margin:8px 0">Day ${st.day}</div><div class="end-breakdown">${reason}<br><br>Budget: ${fmtM(st.money)} · Rep: ${st.rep} · Chaos: ${st.chaos}</div><button class="end-btn" style="background:#ff3b30;margin-top:14px" onclick="playAgain()">Try Again</button>`;
  wrap.appendChild(card);
  addSysMsg('The building is quiet now. It was a fight worth fighting.');
}

// ── Scenario Runner ───────────────────────────────────────────────────────────
async function runScenario(){
  if(st.level===4){runChaosLevel();return;}
  const scenarios=st.levels[st.level-1];
  if(!scenarios||st.scenario>=scenarios.length){levelUp();return;}
  const sc=scenarios[st.scenario];
  setChoiceLabel('');clearChoices();
  addDateStamp(sc.day||('Day '+st.day));
  for(const m of sc.msgs){await addMsg(m.c,m.t);}
  setChoiceLabel(sc.prompt);
  renderChoices(sc.choices,(ch)=>applyChoice(ch,sc));
}

// ── Apply Choice ──────────────────────────────────────────────────────────────
async function applyChoice(ch,sc){
  setChoiceLabel('');clearChoices();
  await addMyMsg(ch.t);
  // apply stats
  if(ch.money) st.money+=ch.money;
  if(ch.money2) st.money+=ch.money2;
  if(ch.rep!=null) st.rep=Math.max(0,Math.min(100,st.rep+ch.rep));
  if(ch.chaos!=null) st.chaos=Math.max(0,Math.round(st.chaos+ch.chaos*DIFF[st.diff].cm));
  if(ch.f1) st.floors.f1=Math.min(10,st.floors.f1+ch.f1);
  if(ch.f2) st.floors.f2=Math.min(10,st.floors.f2+ch.f2);
  if(ch.f3) st.floors.f3=Math.min(10,st.floors.f3+ch.f3);
  if(ch.cafeOpen!=null) st.cafe.open=ch.cafeOpen;
  if(ch.cafeIncome!=null) st.cafe.income=ch.cafeIncome;
  if(ch.cafeShifts!=null) st.cafe.shifts=ch.cafeShifts;
  if(ch.delivOn) st.delivery.on=true;
  if(ch.delivIncome!=null) st.delivery.income=ch.delivIncome;
  updateStats();
  if(checkGameOver()) return;
  await delay(500);
  addSysMsg(ch.result);
  await delay(600);
  // follow-ups
  if(sc&&sc.follow){
    for(const f of sc.follow){
      await addMsg(f.c,ch.good?f.good:f.bad);
    }
  }
  await delay(400);
  // chaos
  const cpp=DIFF[st.diff].cpp;
  for(let i=0;i<cpp;i++){
    if(st.diff==='easy'&&Math.random()<DIFF.easy.skipChance) continue;
    const alive=await triggerChaos();
    if(alive===false) return;
    await delay(600);
  }
  if(st.diff==='hard') st.chaos=Math.min(50,st.chaos+2);
  else if(st.diff==='medium') st.chaos=Math.min(50,st.chaos+1);
  updateStats();
  if(checkGameOver()) return;
  // advance
  st.scenario++;st.day++;
  saveGame();
  runScenario();
}

// ── Chaos ─────────────────────────────────────────────────────────────────────
function getChaosPool(){
  if(st.level===4) return getL4Pool();
  return [CHAOS_L1,CHAOS_L2,CHAOS_L3][st.level-1]||CHAOS_L1;
}

async function triggerChaos(){
  let pool=getChaosPool().filter(e=>!st.usedChaos[e.title]);
  if(pool.length===0){
    const last=st.lastChaos;
    st.usedChaos={};
    pool=getChaosPool().filter(e=>e.title!==last);
  }
  const ev=pool[rand(pool.length)];
  st.usedChaos[ev.title]=true;
  st.lastChaos=ev.title;
  st.chaosCount++;
  // show chaos bubble
  await delay(500);
  const chat=document.getElementById('chat');
  const lbl=document.createElement('div');lbl.className='date-stamp';lbl.textContent='⚠ CHAOS EVENT';chat.appendChild(lbl);scrollBottom();
  showTyping(ev.c);await delay(800);hideTyping();
  const ch=CH[ev.c];
  const sn=document.createElement('div');sn.className='sender-n';sn.textContent=ch.name;chat.appendChild(sn);
  const row=document.createElement('div');row.className='msg-row';
  const av=document.createElement('div');av.className='av-sm';av.style.background=ch.c;av.textContent=ch.i;
  const b=document.createElement('div');b.className='bubble chaos-b';b.innerHTML=`<strong>${ev.title}</strong><br><br>${ev.msg}`;
  row.appendChild(av);row.appendChild(b);chat.appendChild(row);scrollBottom();
  // render choices and wait
  return await new Promise(resolve=>{
    setChoiceLabel('How do you respond?');
    renderChoices(ev.choices,async(choice)=>{
      clearChoices();setChoiceLabel('');
      await addMyMsg(choice.t);
      if(choice.money) st.money+=choice.money;
      if(choice.rep!=null) st.rep=Math.max(0,Math.min(100,st.rep+choice.rep));
      if(choice.chaos!=null) st.chaos=Math.max(0,Math.round(st.chaos+choice.chaos*DIFF[st.diff].cm));
      updateStats();
      await delay(400);
      addSysMsg(choice.result);
      await delay(700);
      if(checkGameOver()){resolve(false);return;}
      resolve(true);
    });
  });
}

// ── Level 4 ───────────────────────────────────────────────────────────────────
async function runChaosLevel(){
  if(st.l4Count===0){
    addDateStamp('— Level 4: All Chaos —');
    await addMsg('gloria',pick(L4_MSGS));
  }
  if(st.l4Count>=9){endGame();return;}
  st.l4Count++;
  setChoiceLabel(`Crisis ${st.l4Count} of 9`);
  await triggerChaos();
  await delay(500);
  saveGame();
  // continue button
  clearChoices();
  const wrap=document.getElementById('choices-wrap');
  const btn=document.createElement('button');btn.className='cb';
  btn.innerHTML=`<span class="cb-t">${st.l4Count<9?`Continue to Crisis ${st.l4Count+1} of 9 →`:'See the Final Score →'}</span>`;
  btn.addEventListener('click',()=>runChaosLevel());
  wrap.appendChild(btn);
  setChoiceLabel(st.l4Count>=9?'One more.':'Breathe. Next crisis incoming.');
}

// ── Level Up ──────────────────────────────────────────────────────────────────
function levelUp(){
  st.level++;st.scenario=0;
  st.chaosQueue=[];st.usedChaos={};
  saveGame();updateStats();
  if(st.level>3){st.level=4;runChaosLevel();return;}
  addDateStamp('— Level '+st.level+' —');
  showPromo();
}

// ── End Game ──────────────────────────────────────────────────────────────────
function endGame(){
  localStorage.removeItem('beaumont_save');
  const mScore=Math.min(100,Math.round(Math.max(0,st.money)/200));
  const rScore=st.rep;
  const cScore=Math.max(0,50-st.chaos);
  const floorScore=Math.round(((st.floors.f1||0)+(st.floors.f2||0)+(st.floors.f3||0))/1.5);
  const cafeScore=st.cafe.open?25:0;
  const delivScore=st.delivery.on?10:0;
  const total=mScore+rScore+cScore+floorScore+cafeScore+delivScore;
  const grade=total>200?'A+':total>165?'A':total>130?'B':total>95?'C':'D';
  clearChoices();setChoiceLabel('');
  const wrap=document.getElementById('choices-wrap');
  const card=document.createElement('div');card.className='end-card';
  card.innerHTML=`
    <div class="end-title">The Grand Beaumont — Final Score</div>
    <div class="end-score">${total} <span style="font-size:28px;color:rgba(255,255,255,.6)">${grade}</span></div>
    <div class="end-breakdown">
      Budget: ${fmtM(st.money)} → ${mScore} pts<br>
      Reputation: ${st.rep} → ${rScore} pts<br>
      Chaos: ${st.chaos} → ${cScore} pts<br>
      Floors: avg ${Math.round(((st.floors.f1||0)+(st.floors.f2||0)+(st.floors.f3||0))/3)}/10 → ${floorScore} pts<br>
      Cafe: ${st.cafe.open?'Open +'+cafeScore:'Closed'}<br>
      Delivery: ${st.delivery.on?'Active +'+delivScore:'Inactive'}
    </div>
    <button class="end-btn" onclick="playAgain()">Play Again</button>`;
  wrap.appendChild(card);
  addSysMsg(total>160?'The Beaumont stands. Thirty rooms. Twelve people. No rent.':total>100?'It wasn\'t easy. It was never going to be easy. But it\'s standing.':'The building took some hits. So did the team. They\'re still there.');
}

function playAgain(){
  document.getElementById('chat').innerHTML='';
  setChoiceLabel('');clearChoices();
  st={};showDiff();
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock(){document.getElementById('nb-clock').textContent=gt();}
updateClock();setInterval(updateClock,60000);

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('load',showDiff);
</script>
